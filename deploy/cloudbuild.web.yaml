# Builds the static viewer image from a pre-built apps/web/dist.
#
# The site is built on the developer's machine by `pnpm run build:web` rather
# than inside Cloud Build, because the build needs the Rust/WASM artefacts that
# are already produced by the local toolchain.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/web.Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
