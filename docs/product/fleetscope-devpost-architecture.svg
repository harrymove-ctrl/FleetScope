<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">FleetScope hackathon architecture</title>
  <desc id="desc">Google ADK agents on Vertex AI inspect Cloud Run and Cloud Storage, write a redacted JSONL evidence stream, and FleetScope projects that stream into a Rust terminal viewer, an Astro WebAssembly browser viewer, and a headless inspection command.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="google" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4f82"/>
      <stop offset="1" stop-color="#17355f"/>
    </linearGradient>
    <linearGradient id="fleet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#214b57"/>
      <stop offset="1" stop-color="#14323d"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312f63"/>
      <stop offset="1" stop-color="#202243"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72a7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62d7bd"/>
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .title { font-size: 54px; font-weight: 700; fill: #f7f9ff; }
      .subtitle { font-size: 25px; font-weight: 400; fill: #aebbd2; }
      .lane { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #85a4ca; }
      .box-title { font-size: 26px; font-weight: 700; fill: #f8fbff; }
      .box-copy { font-size: 19px; font-weight: 400; fill: #c7d2e5; }
      .small { font-size: 17px; font-weight: 500; fill: #aebbd2; }
      .chip { font-size: 16px; font-weight: 700; fill: #dceaff; letter-spacing: 0.5px; }
      .arrow-label { font-size: 16px; font-weight: 600; fill: #8fb5ee; }
    </style>
  </defs>

  <rect width="1800" height="1100" rx="32" fill="url(#background)"/>
  <circle cx="1600" cy="70" r="260" fill="#1b3f70" opacity="0.16"/>
  <circle cx="160" cy="1040" r="330" fill="#1f7067" opacity="0.12"/>

  <text x="80" y="92" class="title">FleetScope</text>
  <text x="80" y="137" class="subtitle">Observable taskmaster for evidence-backed Google Cloud launch readiness</text>
  <rect x="1465" y="63" width="255" height="52" rx="26" fill="#18354f" stroke="#72a7ff" stroke-width="1.5"/>
  <text x="1592" y="96" text-anchor="middle" class="chip">TASKMASTER TRACK</text>

  <text x="80" y="210" class="lane">1 · BOUNDED PROVIDER-BACKED WORKFLOW</text>
  <rect x="80" y="238" width="1640" height="350" rx="28" fill="#0d192b" stroke="#294467" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="125" y="285" width="330" height="230" rx="22" fill="url(#google)" stroke="#4d82c0" stroke-width="2"/>
    <rect x="495" y="285" width="475" height="230" rx="22" fill="url(#google)" stroke="#4d82c0" stroke-width="2"/>
    <rect x="1010" y="285" width="300" height="230" rx="22" fill="#17355f" stroke="#4d82c0" stroke-width="2"/>
    <rect x="1350" y="285" width="325" height="230" rx="22" fill="#17355f" stroke="#4d82c0" stroke-width="2"/>
  </g>

  <text x="165" y="330" class="box-title">Google ADK 2.8.0</text>
  <text x="165" y="370" class="box-copy">launch_readiness</text>
  <text x="165" y="403" class="small">Parallel specialist agents</text>
  <rect x="165" y="435" width="247" height="40" rx="20" fill="#0e2946" stroke="#72a7ff"/>
  <text x="288" y="461" text-anchor="middle" class="chip">6 MODEL CALLS MAX</text>

  <text x="535" y="330" class="box-title">Vertex AI · Gemini 3.7 Flash</text>
  <text x="535" y="374" class="box-copy">cloud_run_probe</text>
  <text x="765" y="374" class="small">services.get · read only</text>
  <text x="535" y="410" class="box-copy">storage_probe</text>
  <text x="765" y="410" class="small">buckets.get · read only</text>
  <text x="535" y="446" class="box-copy">budget_guard</text>
  <text x="765" y="446" class="small">time, calls, reads, writes</text>
  <text x="535" y="482" class="box-copy">launch_reviewer</text>
  <text x="765" y="482" class="small">READY / NOT_READY</text>

  <text x="1050" y="330" class="box-title">Cloud Run</text>
  <text x="1050" y="370" class="box-copy">API + web deployment</text>
  <text x="1050" y="406" class="small">us-central1</text>
  <text x="1050" y="442" class="small">Public demo uses</text>
  <text x="1050" y="471" class="small">recorded-only mode</text>

  <text x="1390" y="330" class="box-title">Cloud Storage</text>
  <text x="1390" y="370" class="box-copy">Optional evidence archive</text>
  <text x="1390" y="406" class="small">Explicit post-run upload</text>
  <text x="1390" y="442" class="small">No workflow writes</text>
  <rect x="1390" y="465" width="235" height="36" rx="18" fill="#0e2946" stroke="#72a7ff"/>
  <text x="1508" y="489" text-anchor="middle" class="chip">UNIFORM ACCESS</text>

  <path d="M455 400 H485" fill="none" stroke="#72a7ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M970 370 H1000" fill="none" stroke="#72a7ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M970 430 C1110 555 1320 555 1342 447" fill="none" stroke="#72a7ff" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <text x="80" y="660" class="lane">2 · REDACTED, APPEND-ONLY EVIDENCE PIPELINE</text>
  <g filter="url(#shadow)">
    <rect x="80" y="690" width="420" height="170" rx="22" fill="url(#fleet)" stroke="#49a99a" stroke-width="2"/>
    <rect x="550" y="690" width="350" height="170" rx="22" fill="url(#fleet)" stroke="#49a99a" stroke-width="2"/>
    <rect x="950" y="690" width="360" height="170" rx="22" fill="url(#fleet)" stroke="#49a99a" stroke-width="2"/>
  </g>

  <text x="120" y="738" class="box-title">Redact + append JSONL</text>
  <text x="120" y="778" class="box-copy">Flush every ADK event as it arrives</text>
  <text x="120" y="814" class="small">Hidden thought text and secrets removed</text>

  <text x="590" y="738" class="box-title">Provider adapter</text>
  <text x="590" y="778" class="box-copy">google-adk@1 → canonical events</text>
  <text x="590" y="814" class="small">Validate · order · de-dupe · pair</text>

  <text x="990" y="738" class="box-title">ViewerSession</text>
  <text x="990" y="778" class="box-copy">Provider-neutral projection core</text>
  <text x="990" y="814" class="small">Graph · timeline · inspector · fingerprint</text>

  <path d="M500 775 H540" fill="none" stroke="#62d7bd" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M900 775 H940" fill="none" stroke="#62d7bd" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M732 515 V680" fill="none" stroke="#72a7ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="750" y="617" class="arrow-label">provider events</text>

  <text x="1370" y="660" class="lane">3 · READ-ONLY SURFACES</text>
  <g filter="url(#shadow)">
    <rect x="1360" y="690" width="360" height="112" rx="20" fill="url(#surface)" stroke="#7775d5" stroke-width="2"/>
    <rect x="1360" y="822" width="360" height="112" rx="20" fill="url(#surface)" stroke="#7775d5" stroke-width="2"/>
    <rect x="1360" y="954" width="360" height="92" rx="20" fill="url(#surface)" stroke="#7775d5" stroke-width="2"/>
  </g>
  <text x="1400" y="735" class="box-title">Rust CLI TUI</text>
  <text x="1400" y="770" class="small">Replay or follow a local session</text>
  <text x="1400" y="867" class="box-title">Astro + WebAssembly</text>
  <text x="1400" y="902" class="small">Browser graph, timeline, inspector</text>
  <text x="1400" y="997" class="box-title">fleetscope inspect</text>
  <text x="1400" y="1028" class="small">Deterministic headless summary</text>

  <path d="M1310 750 H1350" fill="none" stroke="#62d7bd" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M1310 775 C1335 775 1335 878 1350 878" fill="none" stroke="#62d7bd" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M1310 800 C1330 800 1330 1000 1350 1000" fill="none" stroke="#62d7bd" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="80" y="918" width="1230" height="128" rx="22" fill="#101a2b" stroke="#2d4764" stroke-width="2"/>
  <text x="120" y="962" class="box-title">Trust boundary</text>
  <text x="120" y="999" class="box-copy">FleetScope observes evidence; it never starts, retries, authorizes, or mutates agent actions.</text>
  <text x="120" y="1029" class="small">Local files stay local. The hosted demo is recorded-only, needs no credentials, and cannot spend model tokens.</text>
</svg>
